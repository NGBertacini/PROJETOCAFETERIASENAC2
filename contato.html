form{

}

input, textarea{
    font-family: Verdana, Geneva, Tahoma, sans-serif;

<body>

<div class="wrapper">

     <div class="boxLogo">

        <div class="boxMenu">

  <div class="formulario.html">  <!--caixa que receberá o formulario-->

    <form action="post" id="fcontato" action="nycollas.gbbiruel@senac.edu.br">

 <!--método post para guardar as informações 
     id (indentificação) para chamar no css e formatar action para qual email irão os dados temos o method get para pesquisas.Ele não guarda o conteudo GET pesquisa 
 -->
     
 <fieldset id="usuario"> <!-- Conjunto de campos em blocos -->

<legend> Indentificação do Usuário </legend>
<!-- Teremos uma legenda acima do bloco para indentificá-lo -->

<p>
<label for="Nome"> Nome:</label>
</p>

<p>
<input type="text" name="Nome" id="Nome" size="20" maxlength="20"
placeholder="digite seu nome aqui" autofocus required />
</p>

<p> 
   <label for="Mail">Telefone para contato:</label>
</p>

<p>
   <input type="number" name="Num" id="Num" min="0" max="99999" >
</p>

<p> 
   <label for="Mail">E-mail:</label>
</p>

<p>
   <input type="email" name="Mail" id="Mail" size="30" maxlength="30" placeholder="Ex: exemplo@mail.com" required />
</p>

<p>
<label for="Msg">Mansagem:</label> <br>
</p>

<p>
<textarea name="Msg" id="Msg" cols="45" rows="5" placeholder="Deixe aqui sua mensagem" >
</textarea>
</p>

</fieldset>

<input type="submit" name="Enviar" />
<input type="reset" name="Limpar" />

 
</form>        
</div>
